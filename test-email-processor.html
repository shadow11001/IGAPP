<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Processor Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        .test-case {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .test-title {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        .test-input {
            background-color: #f9f9f9;
            padding: 10px;
            border-left: 3px solid #007bff;
            margin-bottom: 10px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9em;
        }
        .test-results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .result-item {
            padding: 8px;
            border-radius: 3px;
            background-color: #f0f0f0;
        }
        .result-label {
            font-weight: bold;
            color: #555;
        }
        .result-value {
            color: #007bff;
            margin-left: 5px;
        }
        .status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.9em;
            margin-left: 10px;
        }
        .pass {
            background-color: #28a745;
            color: white;
        }
        .fail {
            background-color: #dc3545;
            color: white;
        }
        .summary {
            background-color: #007bff;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <h1>🧪 Email Processor Extraction Tests</h1>
    <div id="summary" class="summary">Running tests...</div>
    <div id="test-results"></div>

    <script>
        // Email processor code (extracted from main files)
        const EMAIL_PROCESSOR = {
            emailTypes: {
                'Download Request': {
                    patterns: [
                        /download/gi, 
                        /force.*download/gi, 
                        /push.*download/gi,
                        /request.*download/gi,
                        /need.*download/gi,
                        /version.*download/gi
                    ],
                    template: 'download'
                },
                'Defrost Request': {
                    patterns: [/(?:force|perform|request|run|need|start|initiate)\s+(?:a\s+)?defrost/gi, /emergency\s+defrost/gi, /forced\s+defrost/gi],
                    antiPatterns: [/check.*defrost/gi, /verify.*defrost/gi, /any.*defrost.*overlap/gi],
                    template: 'defrost'
                },
                'General Inquiry': {
                    patterns: [/question/gi, /inquiry/gi, /help/gi, /can\s+you/gi],
                    template: 'general'
                }
            },

            extractWorkOrder(text) {
                const patterns = [
                    /(?:work\s*order|wo|w\/o)[#:\s]*(\d{9})\b/gi,
                    /\bWO(\d{9})\b/gi,
                    /\b(\d{9})\b/g
                ];
                
                for (const pattern of patterns) {
                    const matches = [...text.matchAll(pattern)];
                    if (matches.length > 0) {
                        for (const match of matches) {
                            const fullMatch = match[0];
                            const numberMatch = fullMatch.match(/(\d{9})/);
                            if (numberMatch) {
                                return numberMatch[1];
                            }
                        }
                    }
                }
                return null;
            },

            extractStoreNumber(text) {
                const storePatterns = [
                    /(?:store|site|club)[#:\s]*(\d{1,4})\b/gi,
                    /subject:[^\n]*?(?:store|site|club)[#:\s]*(\d{1,4})\b/gi,
                    /subject:[^\n]*?\b(\d{4})\b/gi
                ];
                
                for (const pattern of storePatterns) {
                    const matches = [...text.matchAll(pattern)];
                    if (matches.length > 0) {
                        for (const match of matches) {
                            const numberMatch = match[1];
                            const num = parseInt(numberMatch);
                            const isInDate = new RegExp(`(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec|\\d{1,2}[/\\-]\\d{1,2}[/\\-]|sent:|date:)[^\\n]*?${numberMatch}`, 'gi').test(text);
                            if (num >= 1 && num <= 9999 && numberMatch.length <= 4 && !isInDate) {
                                return numberMatch;
                            }
                        }
                    }
                }
                return null;
            },

            extractCaseNumber(text) {
                const circuitRackPatterns = [
                    /circuit\s+(\d+)\s+rack\s+([A-Z])/gi,
                    /rack\s+([A-Z])\s+circuit\s+(\d+)/gi
                ];
                
                for (const pattern of circuitRackPatterns) {
                    const matches = [...text.matchAll(pattern)];
                    if (matches.length > 0) {
                        const match = matches[0];
                        let caseNum;
                        if (pattern.source.startsWith('circuit')) {
                            caseNum = match[2] + match[1];
                        } else {
                            caseNum = match[1] + match[2];
                        }
                        return caseNum;
                    }
                }
                
                const casePatterns = [
                    /\b([A-Z]\d+)\b/g,
                    /case\s*([A-Z]\d+)/gi,
                    /defrost.*?([A-Z]\d+)/gi
                ];
                
                for (const pattern of casePatterns) {
                    const matches = [...text.matchAll(pattern)];
                    if (matches.length > 0) {
                        const caseNum = matches[0][1];
                        return caseNum;
                    }
                }
                return null;
            },

            extractRackName(text) {
                const rackPatterns = [
                    /(?:rack|on the|to the)\s*:?\s*(LTA|LTB|LTC|LTD|MTA|MTB|MTC|MTD|DTB|DTA|RCU|CKT)\b/gi,
                    /\b(LTA|LTB|LTC|LTD|MTA|MTB|MTC|MTD|DTB|DTA|RCU|CKT)\s+rack\b/gi,
                    /\b(LTA|LTB|LTC|LTD|MTA|MTB|MTC|MTD|DTB|DTA|RCU|CKT)\s*(?=\s*$|\s*\.|\s*,|\s+controller|\s+system)/gi
                ];
                
                for (const pattern of rackPatterns) {
                    const matches = [...text.matchAll(pattern)];
                    if (matches.length > 0) {
                        const rack = matches[0][1].toUpperCase();
                        return rack;
                    }
                }
                return null;
            },

            extractTechName(text) {
                const namePatterns = [
                    /([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)\s+here/gi,
                    /(?:this\s+is|my\s+name\s+is)\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)/gi,
                    /(?:thanks|regards|sincerely)[,:\s]+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)\s*$/gim,
                    /^([A-Z][a-z]+)\s*\n/gm,
                    /^([A-Z][a-z]+\s+[A-Z][a-z]+)\s*$/gm,
                    /\n\s*([A-Z][a-z]+\s+[A-Z][a-z]+)\s*\n/g
                ];
                
                for (const pattern of namePatterns) {
                    const matches = [...text.matchAll(pattern)];
                    if (matches.length > 0) {
                        const name = matches[0][1].trim();
                        const excludeWords = ['Store', 'Site', 'Rack', 'Case', 'Work', 'Order', 'Tech', 'Phone', 'Email', 'Team', 'There', 'All', 'Thanks', 'Good', 'Morning', 'Afternoon', 'Evening', 'Need', 'Want', 'Could', 'Would', 'Should'];
                        if (!excludeWords.some(word => name.toLowerCase().includes(word.toLowerCase()))) {
                            return name;
                        }
                    }
                }
                return null;
            },

            classifyEmail(text) {
                const lowerText = text.toLowerCase();
                let bestMatch = { type: 'General Inquiry', confidence: 0 };
                
                for (const [type, config] of Object.entries(this.emailTypes)) {
                    let matches = 0;
                    
                    if (config.antiPatterns) {
                        let hasAntiPattern = false;
                        for (const antiPattern of config.antiPatterns) {
                            const found = lowerText.match(antiPattern);
                            if (found) {
                                hasAntiPattern = true;
                                break;
                            }
                        }
                        if (hasAntiPattern) {
                            continue;
                        }
                    }
                    
                    for (const pattern of config.patterns) {
                        const found = lowerText.match(pattern);
                        if (found) {
                            matches += found.length;
                        }
                    }
                    
                    if (matches > bestMatch.confidence) {
                        bestMatch = { type, confidence: matches, template: config.template };
                    }
                }
                
                return bestMatch;
            }
        };

        // Test cases
        const testCases = [
            {
                name: 'Download Request with Tech Name and Rack',
                email: `Hi Team,

Dylan here. Can you push a download to the LTA rack? Store 1234.

Thanks`,
                expected: {
                    techName: 'Dylan',
                    rackName: 'LTA',
                    storeNumber: '1234',
                    emailType: 'Download Request'
                }
            },
            {
                name: 'Email with signature tech name',
                email: `Good afternoon,

Can you help with store 5678?

Thanks,
John Smith`,
                expected: {
                    techName: 'John Smith',
                    storeNumber: '5678'
                }
            },
            {
                name: 'Download request with multiple rack mentions',
                email: `Need a download on the MTC rack for store 9999. The DTB rack is fine.`,
                expected: {
                    rackName: 'MTC',
                    storeNumber: '9999',
                    emailType: 'Download Request'
                }
            },
            {
                name: 'Defrost request with case number',
                email: `Please force a defrost on store 1111, case A5.`,
                expected: {
                    storeNumber: '1111',
                    caseNumber: 'A5',
                    emailType: 'Defrost Request'
                }
            },
            {
                name: 'Work order extraction',
                email: `Work order 123456789 for store 2222. Need assistance with LTB rack.`,
                expected: {
                    workOrder: '123456789',
                    storeNumber: '2222',
                    rackName: 'LTB'
                }
            },
            {
                name: 'First name only at start',
                email: `Dylan

I need help with a download request for LTA rack at store 3333.

Thanks`,
                expected: {
                    techName: 'Dylan',
                    rackName: 'LTA',
                    storeNumber: '3333',
                    emailType: 'Download Request'
                }
            }
        ];

        // Run tests
        function runTests() {
            const resultsContainer = document.getElementById('test-results');
            let passed = 0;
            let failed = 0;

            testCases.forEach((testCase, index) => {
                const results = {
                    workOrder: EMAIL_PROCESSOR.extractWorkOrder(testCase.email),
                    storeNumber: EMAIL_PROCESSOR.extractStoreNumber(testCase.email),
                    caseNumber: EMAIL_PROCESSOR.extractCaseNumber(testCase.email),
                    rackName: EMAIL_PROCESSOR.extractRackName(testCase.email),
                    techName: EMAIL_PROCESSOR.extractTechName(testCase.email),
                    emailType: EMAIL_PROCESSOR.classifyEmail(testCase.email).type
                };

                // Check if test passed
                let testPassed = true;
                let failedFields = [];
                
                Object.keys(testCase.expected).forEach(key => {
                    if (results[key] !== testCase.expected[key]) {
                        testPassed = false;
                        failedFields.push(key);
                    }
                });

                if (testPassed) {
                    passed++;
                } else {
                    failed++;
                }

                // Create test case HTML
                const testDiv = document.createElement('div');
                testDiv.className = 'test-case';
                testDiv.innerHTML = `
                    <div class="test-title">
                        Test ${index + 1}: ${testCase.name}
                        <span class="status ${testPassed ? 'pass' : 'fail'}">${testPassed ? '✓ PASS' : '✗ FAIL'}</span>
                    </div>
                    <div class="test-input">${testCase.email}</div>
                    <div class="test-results">
                        ${Object.keys(results).map(key => {
                            const expected = testCase.expected[key];
                            const actual = results[key];
                            const matches = expected !== undefined ? (expected === actual) : true;
                            return `
                                <div class="result-item" style="${!matches ? 'border-left: 3px solid #dc3545;' : ''}">
                                    <span class="result-label">${key}:</span>
                                    <span class="result-value">${actual || 'null'}</span>
                                    ${expected !== undefined ? `<br><small style="color: #666;">Expected: ${expected || 'null'}</small>` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                resultsContainer.appendChild(testDiv);
            });

            // Update summary
            const total = passed + failed;
            const summaryDiv = document.getElementById('summary');
            summaryDiv.innerHTML = `
                ✅ ${passed} / ${total} tests passed
                ${failed > 0 ? `• ❌ ${failed} failed` : ''}
            `;
            summaryDiv.style.backgroundColor = failed === 0 ? '#28a745' : '#dc3545';
        }

        // Run tests on page load
        window.onload = runTests;
    </script>
</body>
</html>
